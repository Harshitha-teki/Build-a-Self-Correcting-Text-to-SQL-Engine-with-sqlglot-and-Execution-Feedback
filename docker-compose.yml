# =============================================================================
# docker compose up -d --build
#   db  : PostgreSQL, auto-seeds scripts/seed_db.sql on first boot
#   api : FastAPI engine, waits for db healthcheck before starting
#
# Variables can be supplied via a local .env file (see .env.example) or the
# shell; sensible defaults keep `docker compose up` working out of the box.
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: t2sql_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ecommerce_messy}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Auto-seed runs only on an EMPTY data directory (first boot).
      - ./scripts/seed_db.sql:/docker-entrypoint-initdb.d/00_seed_db.sql:ro
      - t2sql_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ecommerce_messy}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    container_name: t2sql_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database host is the service name `db`.
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-ecommerce_messy}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-ecommerce_messy}
      # LLM configuration (leave blank / placeholder to run in offline mode).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your_key_here}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      MAX_REPAIR_ATTEMPTS: ${MAX_REPAIR_ATTEMPTS:-3}
      ENABLE_SEMANTIC_CHECKS: ${ENABLE_SEMANTIC_CHECKS:-true}
      CARTESIAN_ROW_THRESHOLD: ${CARTESIAN_ROW_THRESHOLD:-1000}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  t2sql_pgdata:
